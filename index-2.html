<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GabeTech Spares Shop Kimilili – POS</title>
<meta name="theme-color" content="#ff86bd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GabeTech POS">
<style>
:root{
  --bg:#ffe0ee; --brand:#ff86bd; --surface:#ffffff; --surface2:#fff1f7; --ink:#2b1020; --muted:#6e3a55; --line:#f5b3d1;
  --accent:#c2185b; --accent-ink:#ffffff; --grad:linear-gradient(135deg,#ee4f93,#c2185b); --tape:#f3c94a; --tape-ink:#33290a;
  --ok:#1f7a45; --warn:#9a5b00; --bad:#b3261e;
  --okbg:#d8f0de; --warnbg:#fcefcf; --badbg:#fadcd8; --infobg:#dcebf5; --info:#24506f;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;margin:0;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.topbar{background:var(--brand);display:flex;align-items:center;justify-content:center;gap:12px;height:76px;padding:0 16px;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(0,0,0,.08)}
.topbar .a{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:26px;font-style:italic;font-weight:900;letter-spacing:.8px;text-transform:uppercase;line-height:1}
.topbar .b{font-size:12.5px;color:var(--ink);opacity:.8;margin-top:3px;letter-spacing:.3px}
.topbar .who{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 76px)}
.side{background:var(--surface2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:76px;height:calc(100vh - 76px)}
.btxt{text-align:center;min-width:0}
.blogo{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.tape{height:20px;background:var(--tape);position:relative;border-top:1px solid rgba(0,0,0,.15);border-bottom:1px solid rgba(0,0,0,.15);
  background-image:
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px),
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 40px);
  background-size:100% 6px,100% 11px;background-repeat:repeat-x;background-position:0 0,0 0}
nav.menu{padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav.menu button:hover{background:var(--surface2);color:var(--ink)}
nav.menu button.on{background:#a3124d;color:#fff}
nav.menu svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;padding:14px 16px;font-size:12px;color:var(--ink);background:var(--brand);border-top:1px solid rgba(0,0,0,.08)}
main{padding:24px clamp(14px,3vw,34px) 60px;min-width:0}
.banner{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px}

.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:30px}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:2px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--grad);border-color:#a3124d;color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.search{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{color:var(--ink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full,.full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button,.seg label{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--grad);color:var(--accent-ink)}
.seg.wide{display:flex}
.seg.wide label{flex:1;text-align:center;display:flex;gap:8px;align-items:center;justify-content:center}
.seg.wide label input{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.chip.on{background:var(--grad);color:var(--accent-ink);border-color:#a3124d}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list{overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.pitem{flex-direction:column;align-items:stretch;gap:10px}
.ptop{display:flex;gap:12px;align-items:center}
.ptop .t2{overflow-wrap:anywhere}
.pbot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface2)}
.grow{flex:1;min-width:0}
.t1{font-weight:600}
.t2{font-size:13px;color:var(--muted)}
.right{text-align:right;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:var(--infobg);color:var(--info)}
.mono{font-variant-numeric:tabular-nums}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px 18px;border-top:3px solid var(--accent)}
.stat .sub2{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat .n{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.stat.alert .n{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.cols h3{padding:14px 16px 6px;font-size:18px}

/* POS */
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.pos-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:88px}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile:disabled{opacity:.45}
.tile .p{margin-top:auto;font-weight:700;color:var(--accent)}
.cart{position:sticky;top:16px;padding:16px}
.cart h3{font-size:20px;margin-bottom:8px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .ctl{display:flex;gap:6px;align-items:center}
.line .ctl input{width:84px;padding:5px 8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:28px;height:28px;font-weight:700}
.qty span{min-width:28px;text-align:center}
.totals{display:grid;gap:4px;padding:12px 0}
.totals div{display:flex;justify-content:space-between}
.totals .g{font-size:19px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:22px;border:1px solid var(--line)}
.modal.wide{max-width:720px}
.modal h2{font-size:26px;margin-bottom:14px}
.modal .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sect{margin:16px 0 6px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px;font-weight:600}
.sched{display:grid;gap:6px}
.sched .r{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.sched .r.done{background:var(--okbg)}
.sched .r.late{background:var(--badbg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;max-width:90vw}

/* pictures */
.pic{width:110px;height:110px;border-radius:12px;border:1px dashed var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;text-align:center}
.pic img{width:100%;height:100%;object-fit:cover}
.picrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2);border:1px solid var(--line);cursor:zoom-in}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--accent);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:default}
.tile .timg{width:100%;height:78px;border-radius:8px;object-fit:cover;background:var(--surface2);display:block}
.tile .timg.ph{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
/* login */
body.locked .shell,body.locked .topbar{display:none}
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:400px;overflow:hidden}
.authbody{padding:22px}
.authlogo{display:block;width:150px;height:150px;margin:0 auto 8px;object-fit:contain;background:#fff;border-radius:12px}
.authh{font-size:26px;text-align:center;margin-bottom:6px}
.onecol{display:grid;gap:12px}
.pw{display:flex;gap:6px}
.autherr{color:var(--bad);min-height:20px;font-size:13.5px;margin:8px 0}
.code{font:700 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;padding:14px;border:2px dashed var(--tape);border-radius:10px;margin:12px 0;user-select:all}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.chk input{width:auto}
/* scanner */
.scan{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.scan .view{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}
.scan video{width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:8%;right:8%;top:25%;height:32%;border:3px solid var(--tape);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none}
.scan .panel{background:var(--surface);padding:14px;display:grid;gap:10px}
.scan .panel form{display:flex;gap:6px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff}
  #printArea{display:block;position:relative;color:#000;background:#fff;font:13px/1.4 Georgia,serif;max-width:380px;margin:0 auto;padding:8px}
  #printArea .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;overflow:hidden}
  #printArea .wm img{width:92%;opacity:.13;mix-blend-mode:multiply}
  #printArea .rc{position:relative;z-index:1}
  #printArea h1{font-size:22px;text-align:center;margin:0}
  #printArea .c{text-align:center}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0}
  #printArea td,#printArea th{padding:3px 0;text-align:left;border-bottom:1px dotted #999}
  #printArea td.r,#printArea th.r{text-align:right}
  #printArea hr{border:0;border-top:1px dashed #000}
}

@media (max-width:900px){
  .pos{grid-template-columns:1fr}
  .cart{position:static}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:40}
  .side .foot{display:none}
  .topbar{height:auto;min-height:64px;padding:8px 14px;flex-wrap:wrap;position:static}
  .topbar .a{font-size:22px}
  .topbar .blogo{width:42px;height:42px}
  .topbar .who{position:static;transform:none;flex-basis:100%;text-align:center;font-size:12px;margin-top:-2px}
  .shell{min-height:0}
  nav.menu{flex-direction:row;padding:6px;gap:2px;width:100%;overflow-x:auto}
  nav.menu button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;align-items:center;text-align:center}
  main{padding-bottom:100px}
  .side{background:var(--brand);border-top:1px solid rgba(0,0,0,.1)}
  nav.menu button{color:var(--ink)}
  nav.menu button:hover{background:rgba(255,255,255,.45)}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:12px 14px}
  .stat .n{font-size:22px}
  .formgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="modalRoot"></div>
<div id="scanRoot"></div>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const addPeriod=(s,f,i)=>{
  if(f==='monthly'){const d=parseD(s);d.setMonth(d.getMonth()+i);return iso(d)}
  return addDays(s,(f==='weekly'?7:14)*i);
};
const fmtDate=s=>s?parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const money=n=>db.settings.currency+(/[A-Za-z]$/.test(db.settings.currency)?' ':'')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const freqLabel={weekly:'weekly',biweekly:'every 2 weeks',monthly:'monthly'};

const paidOf=o=>round2(o.payments.reduce((a,p)=>a+p.amount,0));
const balOf=o=>round2(o.total-paidOf(o));
const custName=id=>{const c=db.customers.find(c=>c.id===id);return c?c.name:'Walk-in customer'};
const vendName=id=>{const v=db.vendors.find(v=>v.id===id);return v?v.name:''};

function schedule(o){
  if(!o.plan) return [];
  const {deposit,count,frequency,firstDue}=o.plan;
  const rem=round2(o.total-deposit);
  const base=Math.floor(rem/count*100)/100;
  let pool=Math.max(0,round2(paidOf(o)-deposit));
  const out=[];
  for(let i=0;i<count;i++){
    const amt=i===count-1?round2(rem-base*(count-1)):base;
    const applied=Math.min(pool,amt);
    pool=round2(pool-applied);
    out.push({n:i+1,due:addPeriod(firstDue,frequency,i),amount:amt,paid:round2(applied),done:applied>=amt-0.005});
  }
  return out;
}
const isOverdue=o=>o.status!=='Cancelled'&&balOf(o)>0.005&&o.plan&&schedule(o).some(s=>!s.done&&s.due<today());
function payBadge(o){
  if(o.status==='Cancelled') return '<span class="badge bad">Cancelled</span>';
  const b=balOf(o);
  if(b<=0.005) return '<span class="badge ok">Paid</span>';
  if(isOverdue(o)) return '<span class="badge bad">Overdue</span>';
  return paidOf(o)>0?'<span class="badge warn">Part paid</span>':'<span class="badge warn">Unpaid</span>';
}
const statusBadge=o=>o.status==='Cancelled'?'':`<span class="badge info">${esc(o.status)}</span>`;

  const t=document.createElement('div');t.className='toast';t.textContent=msg;

}

let dashRange='today',dashFrom='',dashTo='';
function dashBounds(){
  const t=today();
  if(dashRange==='today')return [t,t,'Today'];
  if(dashRange==='yesterday'){const y=addDays(t,-1);return [y,y,'Yesterday']}
  if(dashRange==='week'){const dow=(parseD(t).getDay()+6)%7;return [addDays(t,-dow),t,'This week']}
  if(dashRange==='month')return [t.slice(0,8)+'01',t,'This month'];
  if(dashRange==='last30')return [addDays(t,-29),t,'Last 30 days'];
  const f=dashFrom||t,e=dashTo||t;
  return f<=e?[f,e,'Selected dates']:[e,f,'Selected dates'];
}
function setRange(r){dashRange=r;render()}
function setCustom(which,v){if(which==='f')dashFrom=v;else dashTo=v;dashRange='custom';render()}
function viewDash(){
  const t=today();
  const [from,to,rlabel]=dashBounds();
  const inR=d=>d>=from&&d<=to;
  const rangeText=from===to?fmtDate(from):`${fmtDate(from)} to ${fmtDate(to)}`;
  const act=db.orders.filter(o=>o.status!=='Cancelled');
  const collected=round2(db.orders.flatMap(o=>o.payments).filter(p=>inR(p.date)).reduce((a,p)=>a+p.amount,0));
  const ordersIn=act.filter(o=>inR(o.date));
  const salesRange=round2(ordersIn.reduce((a,o)=>a+o.total,0));
  const stockUnits=db.products.reduce((a,p)=>a+Math.max(0,p.stock),0);
  const stockValue=round2(db.products.reduce((a,p)=>a+Math.max(0,p.stock)*(p.cost||0),0));
  const chip=(k,l)=>`<button class="chip ${dashRange===k?'on':''}" onclick="setRange('${k}')">${l}</button>`;
  const owed=round2(act.reduce((a,o)=>a+Math.max(0,balOf(o)),0));
  const overdue=act.filter(isOverdue);
  const open=act.filter(o=>['Pending','In progress'].includes(o.status));
  const ready=act.filter(o=>o.status==='Ready');
  const low=db.products.filter(p=>p.stock<=p.low);
  const dues=act.flatMap(o=>schedule(o).filter(s=>!s.done).slice(0,1).map(s=>({o,s})))
    .filter(x=>x.s.due<=addDays(t,7)).sort((a,b)=>a.s.due.localeCompare(b.s.due)).slice(0,8);
  const rowOrder=o=>`<div class="item click" onclick="orderDetail('${o.id}')"><div class="grow"><div class="t1">${esc(custName(o.customerId))}</div><div class="t2">#${esc(o.no)} · due ${fmtDate(o.due)}</div></div><div class="right mono">${money(balOf(o))}<div class="t2">balance</div></div></div>`;
  return backupNag()+pageHead('Dashboard',new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),'<button class="btn pri" onclick="go(\'sale\')">New sale</button>')+

  ${dashRange==='custom'?`<div class="formgrid" style="max-width:420px;margin-bottom:10px"><label class="fld"><span>From</span><input type="date" value="${dashFrom||t}" max="${t}" onchange="setCustom('f',this.value)"></label><label class="fld"><span>To</span><input type="date" value="${dashTo||t}" max="${t}" onchange="setCustom('t',this.value)"></label></div>`:''}
  <div class="t2" style="margin-bottom:10px">Showing ${esc(rlabel.toLowerCase())}: ${rangeText}</div>
  <div class="stats">
    <div class="card stat"><div class="n mono">${money(salesRange)}</div><div class="l">Sales · ${esc(rlabel.toLowerCase())}</div><div class="sub2">${ordersIn.length} order${ordersIn.length===1?'':'s'}</div></div>

    <div class="card stat"><div class="n mono">${stockUnits.toLocaleString()}</div><div class="l">Total stock (products)</div><div class="sub2">${db.products.length} product${db.products.length===1?'':'s'} · ${money(stockValue)} at cost</div></div>

function addToCart(type,id){
  const src=type==='product'?db.products:db.services;
  const it=src.find(x=>x.id===id);if(!it)return;
  const ex=cart.find(c=>c.type===type&&c.refId===id);

  if(type==='product'&&q>it.stock){toast(`Only ${it.stock} in stock`);return}
  if(ex)ex.qty=q;else cart.push({type,refId:id,name:it.name,price:it.price,qty:1,days:it.days||0});

function cartQty(i,d){
  const c=cart[i];const q=c.qty+d;

    c.qty=q;
  }
  posCart();
}

function coCalc(e){
  const f=$('#coForm');if(!f)return;
  const sub=cartSub();
  const disc=Math.min(sub,Math.max(0,num(f.disc.value)));
  const taxable=sub-disc;
  const tax=round2(taxable*db.settings.taxRate/100);
  const total=round2(taxable+tax);
  const mode=f.mode.value;
  $('#coNew').hidden=f.cust.value!=='__new';
  $('#coPlan').hidden=mode!=='plan';
  $('#coTotals').innerHTML=`<div><span>Subtotal</span><span class="mono">${money(sub)}</span></div>${disc?`<div><span>Discount</span><span class="mono">−${money(disc)}</span></div>`:''}${tax?`<div><span>Tax (${db.settings.taxRate}%)</span><span class="mono">${money(tax)}</span></div>`:''}<div class="g"><span>Total</span><span class="mono">${money(total)}</span></div>`;
  let plan=null;
  if(mode==='plan'){
    if(f.dep.value===''&&!f.dep.dataset.t)f.dep.value=round2(total/2);
    if(e&&e.target&&e.target.name==='dep')f.dep.dataset.t=1;
    const dep=Math.min(total,Math.max(0,num(f.dep.value)));
    const cnt=Math.min(24,Math.max(1,Math.floor(num(f.cnt.value))||1));
    plan={deposit:round2(dep),count:cnt,frequency:f.freq.value,firstDue:f.first.value||addDays(today(),30)};
    const fake={total,payments:[{amount:dep}],plan};
    $('#coPrev').innerHTML=`<div class="t2" style="margin-bottom:6px">Paying ${money(dep)} today. Remaining ${money(total-dep)} in ${cnt} payment${cnt>1?'s':''}, ${freqLabel[plan.frequency]}:</div><div class="sched">${schedule(fake).map(s=>`<div class="r"><span class="t2">${s.n}</span><span>${fmtDate(s.due)}</span><span></span><span class="mono t1">${money(s.amount)}</span></div>`).join('')}</div>`;
    $('#coBtn').textContent='Start installment plan';
  }else $('#coBtn').textContent='Complete sale';
  return {sub,disc,tax,total,mode,plan};
}
function coDone(e){
  e.preventDefault();
  const f=e.target,c=coCalc();
  let custId=f.cust.value;
  if(custId==='__new'){
    if(!f.nname.value.trim()){toast('Enter the new customer\'s name');return false}
  }
  if(c.mode==='plan'&&!custId){toast('Choose a customer for an installment plan');return false}
  if(c.mode==='plan'&&c.plan.deposit>=c.total&&c.total>0){toast('Deposit must be less than the total');return false}
  for(const it of cart){
    if(it.type==='product'){const p=db.products.find(x=>x.id===it.refId);if(!p||it.qty>p.stock){toast(`Not enough stock for ${it.name}`);return false}}
  }
  if(custId==='__new'){
    const nc={id:uid(),name:f.nname.value.trim(),phone:f.nphone.value.trim(),email:'',address:'',bike:'',notes:''};
    db.customers.push(nc);custId=nc.id;
  }
  const hasSvc=cart.some(x=>x.type==='service');
  const o={id:uid(),no:'AF-'+(db.seq.order++),date:today(),customerId:custId,
    items:cart.map(x=>({...x})),subtotal:c.sub,discount:c.disc,tax:c.tax,total:c.total,
    payments:[],plan:c.mode==='plan'?c.plan:null,due:f.due?f.due.value:'',
    status:hasSvc?'Pending':'Delivered',notes:f.notes.value.trim(),by:cur.name};
  const method=f.method.value;
  if(c.mode==='full'){ if(c.total>0)o.payments.push({id:uid(),date:today(),amount:c.total,method,note:'Paid in full',by:cur.name}); }
  else if(c.plan.deposit>0) o.payments.push({id:uid(),date:today(),amount:c.plan.deposit,method,note:'Deposit',by:cur.name});
  cart.forEach(it=>{if(it.type==='product'){const p=db.products.find(x=>x.id===it.refId);if(p)p.stock-=it.qty}});
  db.orders.unshift(o);
  cart=[];save();closeModal();toast('Sale saved');
  render();orderDetail(o.id);
  return false;
}

function setStatus(id,s){
  const o=db.orders.find(x=>x.id===id);o.status=s;save();
  if(s==='Delivered'&&balOf(o)>0.005)toast('Delivered, with a balance still owing');
  render();
}
function cancelOrder(id){
  if(!needOwner())return;
  askConfirm('Cancel this order? Product stock will go back on the shelf. Payments already taken stay on record, so refund the customer separately if needed.',()=>{
    const o=db.orders.find(x=>x.id===id);
    o.items.forEach(it=>{if(it.type==='product'){const p=db.products.find(x=>x.id===it.refId);if(p)p.stock+=it.qty}});
    o.status='Cancelled';save();render();orderDetail(id);
  },'Cancel order');
}
function payModal(id){
  const o=db.orders.find(x=>x.id===id);
  const bal=balOf(o);
  let def=bal;
  if(o.plan){const nx=schedule(o).find(s=>!s.done);if(nx)def=round2(nx.amount-nx.paid)}
  window._payOrder=id;window._payBal=bal;
  openModal(`<h2>Record payment</h2><p class="t2">Order #${esc(o.no)} · ${esc(custName(o.customerId))} · balance ${money(bal)}</p>
  <form onsubmit="return paySave(event)"><div class="formgrid">
    <label class="fld"><span>Amount</span><input name="amount" type="number" step="any" min="0.01" max="${bal}" value="${def}" required></label>
    <label class="fld"><span>Method</span><select name="method"><option>Cash</option><option>Card</option><option>Mobile money</option><option>Bank transfer</option></select></label>
    <label class="fld"><span>Date</span><input name="date" type="date" value="${today()}"></label>
    <label class="fld"><span>Note</span><input name="note" placeholder="Optional"></label>
  </div><div class="bar"><button type="button" class="btn" onclick="orderDetail('${id}')">Back</button><button class="btn pri">Save payment</button></div></form>`);
}
function paySave(e){
  e.preventDefault();const f=e.target;
  const o=db.orders.find(x=>x.id===window._payOrder);
  const amt=round2(num(f.amount.value));
  if(amt<=0){toast('Enter an amount');return false}
  if(amt>window._payBal+0.005){toast('That is more than the balance');return false}
  o.payments.push({id:uid(),date:f.date.value||today(),amount:amt,method:f.method.value,note:f.note.value.trim(),by:cur.name});
  save();toast('Payment recorded');render();orderDetail(o.id);return false;
}

  $('#printArea').innerHTML=`<div class="wm"><img src="${getLogo()}" alt=""></div><div class="rc"><h1>${esc(BIZ)}</h1><div class="c">${esc(s.address)}${s.address&&s.phone?'<br>':''}${esc(s.phone)}</div><hr>

let imgs={},idb=null,imgOK=true,pendingImg;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('gabetech_pos_img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function imgLoad(){
  try{
    idb=await idbOpen();
    await new Promise((res,rej)=>{const rq=idb.transaction('img').objectStore('img').openCursor();
      rq.onsuccess=()=>{const c=rq.result;if(c){imgs[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>rej(rq.error)});
  }catch(e){imgOK=false}
}
function idbRun(fn){
  if(!idb)return Promise.resolve();
  return new Promise(res=>{try{const tx=idb.transaction('img','readwrite');fn(tx.objectStore('img'));tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>res()}catch(e){res()}});
}
const imgPut=(id,d)=>{imgs[id]=d;return idbRun(s=>s.put(d,id))};
const imgDel=id=>{delete imgs[id];return idbRun(s=>s.delete(id))};
async function imgReplace(map){imgs={};await idbRun(s=>s.clear());for(const [k,v] of Object.entries(map||{}))await imgPut(k,v)}
function fileToThumb(file,max=480){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};
    im.src=url;
  });
}

/* ---------- BARCODE SCANNER (phone camera) ---------- */
let scanStream=null,scanTimer=0,scanDet=null,scanCb=null,scanLast='',scanLastT=0,scanUnknown='';
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},120)}catch(e){}
  if(navigator.vibrate)navigator.vibrate(60);
}
async function openScanner(cb,title){
  stopScan();scanCb=cb;scanUnknown='';scanLast='';scanLastT=0;
  $('#scanRoot').innerHTML=`<div class="scan"><div class="view"><video id="scanVid" playsinline muted></video><div class="frame"></div></div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(title)}</b><button class="btn sm" onclick="closeScanner()">Done</button></div>
  <div id="scanMsg" class="t2">Starting camera…</div>
  <button class="btn pri" id="scanNew" hidden onclick="scanAddNew()">Add as new product</button>
  <form onsubmit="return scanManual(event)"><input name="code" placeholder="Or type the code" autocomplete="off"><button class="btn">Use</button></form></div></div>`;
  const msg=t=>{const m=$('#scanMsg');if(m)m.textContent=t};
  if(!window.isSecureContext||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    msg('The camera works only when the app is opened from its web address or installed on the home screen. You can still type the code below.');return}
  if(!('BarcodeDetector' in window)){
    msg('This browser cannot read barcodes with the camera. Use Chrome on Android, or type the code below.');return}
  try{
    scanDet=new BarcodeDetector();
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('#scanVid');if(!v){stopScan();return}
    v.srcObject=scanStream;await v.play();
    msg('Point the camera at a barcode');
    scanLoop();
  }catch(e){
    msg(e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this app in the browser settings, or type the code below.':'Could not start the camera. Type the code below instead.');
  }
}
function scanLoop(){
  const v=$('#scanVid');if(!v||!scanStream)return;
  scanDet.detect(v).then(codes=>{
    if(codes&&codes.length&&codes[0].rawValue){
      const code=codes[0].rawValue,now=Date.now();
      const same=code===scanLast&&now-scanLastT<1500;
      scanLast=code;scanLastT=now;
      if(!same)handleScan(code);
    }
  }).catch(()=>{}).finally(()=>{scanTimer=setTimeout(scanLoop,150)});
}
function handleScan(code){
  beep();
  const r=scanCb?(scanCb(String(code).trim())||{}):{};
  const m=$('#scanMsg');if(m)m.textContent=r.msg||('Scanned '+code);
  scanUnknown=own()?(r.unknown||''):'';const b=$('#scanNew');if(b)b.hidden=!scanUnknown;
  if(r.close)closeScanner();
}
function scanManual(e){e.preventDefault();const c=e.target.code.value.trim();if(c){handleScan(c);e.target.code.value=''}return false}
function stopScan(){clearTimeout(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function closeScanner(){stopScan();$('#scanRoot').innerHTML=''}

let cur=null,lockedId=null,lockTimer=0,hiddenAt=0;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=(n=16)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return hex(a)};
function cyrb(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hashPw(pw,salt,alg){
  alg=alg||(window.crypto&&crypto.subtle?'pbkdf2':'js');
  if(alg==='pbkdf2'){
    const enc=new TextEncoder();
    const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},k,256);
    return {alg,hash:hex(b)};
  }
  let h=pw+salt;for(let i=0;i<5000;i++)h=cyrb(h+salt+i);
  return {alg:'js',hash:h};
}
async function setPw(u,pw){const salt=rnd(16);const r=await hashPw(pw,salt);u.salt=salt;u.alg=r.alg;u.hash=r.hash}
async function mkUser(name,username,pw,role){const u={id:uid(),name,username:username.toLowerCase(),role};await setPw(u,pw);return u}
async function checkPw(u,pw){try{return (await hashPw(pw,u.salt,u.alg)).hash===u.hash}catch(e){return false}}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>A[x%A.length]).join('').match(/.{4}/g).join('-')}
const normCode=c=>String(c).toUpperCase().replace(/[^A-Z0-9]/g,'');
async function newRecovery(){
  const code=genCode(),salt=rnd(16),r=await hashPw(normCode(code),salt);
  db.recovery={salt,alg:r.alg,hash:r.hash};return code;
}

async function throttled(err){
  const now=Date.now();
  if(db.sec.until>now){err(`Too many attempts. Try again in ${Math.ceil((db.sec.until-now)/1000)} seconds.`);return true}
  return false;
}
function failed(err,msg){
  db.sec.fails++;if(db.sec.fails>=5){db.sec.until=Date.now()+30000;db.sec.fails=0;msg='Too many attempts. Wait 30 seconds and try again.'}
  save();err(msg);
}
async function doLogin(e){
  e.preventDefault();const f=e.target;const err=m=>{const el=$('#authErr');if(el)el.textContent=m};
  if(await throttled(err))return false;
  const u=db.users.find(x=>x.username===f.u.value.trim().toLowerCase());
  const ok=u?await checkPw(u,f.p.value):false;
  if(!ok){failed(err,'Wrong username or password.');f.p.value='';return false}
  db.sec.fails=0;db.sec.until=0;db.sec.last=u.username;save();enter(u);return false;
}

async function doSetup(e){
  e.preventDefault();const f=e.target;const err=m=>{$('#authErr').textContent=m};
  const un=f.u.value.trim().toLowerCase();

  if(f.p.value!==f.p2.value)return err('The two passwords do not match.'),false;

    ${pwField('p2','Confirm new password','new-password')}
  </div><div id="authErr" class="autherr"></div><button class="btn pri" style="width:100%">Reset password</button></form>
  <p class="t2" style="text-align:center;margin-bottom:0"><a href="#" onclick="showLogin();return false">Back to sign in</a></p>`);
}
async function doRecover(e){
  e.preventDefault();const f=e.target;const err=m=>{const el=$('#authErr');if(el)el.textContent=m};
  if(await throttled(err))return false;
  if(f.p.value.length<4)return err('Password must be at least 4 characters.'),false;
  if(f.p.value!==f.p2.value)return err('The two passwords do not match.'),false;
  let ok=false;
  if(db.recovery){try{ok=(await hashPw(normCode(f.c.value),db.recovery.salt,db.recovery.alg)).hash===db.recovery.hash}catch(x){}}
  if(!ok){failed(err,'That recovery code is not correct.');return false}
  const o=db.users.find(u=>u.role==='owner');
  await setPw(o,f.p.value);db.sec.fails=0;db.sec.until=0;
  const code=await newRecovery();save();
  showRecoveryCode(code,o);return false;
}
function enter(u){
  cur=u;if(lockedId&&lockedId!==u.id)cart=[];lockedId=null;
  document.body.classList.remove('locked');$('#authRoot').innerHTML='';
  if(!allowed(view)||(!own()&&view==='dash'))view=own()?'dash':'sale';
  render();armLock();window.scrollTo(0,0);
}
function lockApp(keepCart){
  if(!cur)return;
  lockedId=keepCart?cur.id:null;if(!keepCart)cart=[];
  cur=null;clearTimeout(lockTimer);closeModal();closeScanner();
  $('#printArea').innerHTML='';$('#main').innerHTML='';drawNav();showLogin();
}
const logout=()=>lockApp(false);
function armLock(){
  clearTimeout(lockTimer);
  const m=db.settings.lockMin;
  if(cur&&m>0)lockTimer=setTimeout(()=>lockApp(true),m*60000);
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(cur)armLock()},{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  const m=db.settings.lockMin;
  if(cur&&m>0&&hiddenAt&&Date.now()-hiddenAt>m*60000)lockApp(true);
  hiddenAt=0;
});

/* team management (owner) */
function teamCard(){
  const rows=db.users.map(u=>`<div class="item"><div class="grow"><div class="t1">${esc(u.name)}</div><div class="t2">@${esc(u.username)}</div></div><span class="badge ${u.role==='owner'?'info':''}">${u.role==='owner'?'Owner':'Staff'}</span><div class="actions">${u.id!==cur.id?`<button class="btn sm" onclick="resetPw('${u.id}')">Reset password</button>`:''}${u.role==='staff'?`<button class="btn sm bad" onclick="removeUser('${u.id}')">Remove</button>`:''}</div></div>`).join('');
  return `<div class="card" style="padding:18px;max-width:640px;margin-bottom:16px"><h3 style="margin-bottom:6px">Team and security</h3>
  <p class="t2" style="margin-top:0">Staff can make sales, take payments and manage customers. They cannot see the dashboard, cost prices, vendors or settings, and cannot delete records.</p>
  <div class="card list" style="margin-bottom:12px">${rows}</div>
  <div class="formgrid"><label class="fld"><span>Lock automatically after</span><select onchange="setLock(this.value)">${[[1,'1 minute'],[5,'5 minutes'],[15,'15 minutes'],[0,'Never']].map(([v,l])=>`<option value="${v}" ${+db.settings.lockMin===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn pri" onclick="addStaff()">Add staff</button><button class="btn" onclick="changeMyPw()">Change my password</button></div></div>`;
}
function setLock(v){db.settings.lockMin=+v;save();armLock();toast('Auto-lock updated')}
function addStaff(){
  if(!needOwner())return;
  formModal('Add staff member',[
    {k:'name',l:'Name',req:1,full:1},{k:'username',l:'Username',req:1},{k:'pw',l:'Password (4+ characters)',t:'password',req:1}
  ],{},async o=>{
    const un=o.username.toLowerCase();
    if(!validUser(un))return toast('Username: 3–20 letters, numbers, dot, dash or underscore');
    if(db.users.some(u=>u.username===un))return toast('That username is taken');
    if(o.pw.length<4)return toast('Password needs at least 4 characters');
    db.users.push(await mkUser(o.name,un,o.pw,'staff'));save();closeModal();render();toast('Staff member added');
  });
}
function resetPw(id){
  if(!needOwner())return;
  const u=db.users.find(x=>x.id===id);if(!u)return;
  formModal('New password for '+u.name,[{k:'pw',l:'New password (4+ characters)',t:'password',req:1,full:1}],{},async o=>{
    if(o.pw.length<4)return toast('Password needs at least 4 characters');
    await setPw(u,o.pw);save();closeModal();toast('Password changed');
  });
}
function changeMyPw(){
  formModal('Change my password',[
    {k:'old',l:'Current password',t:'password',req:1,full:1},{k:'pw',l:'New password (4+ characters)',t:'password',req:1,full:1}
  ],{},async o=>{
    if(!(await checkPw(cur,o.old)))return toast('Current password is not correct');
    if(o.pw.length<4)return toast('Password needs at least 4 characters');
    await setPw(cur,o.pw);save();closeModal();toast('Password changed');
  });
}
function removeUser(id){
  if(!needOwner())return;
  const u=db.users.find(x=>x.id===id);if(!u||u.role==='owner')return;
  askConfirm(`Remove ${u.name}? They will no longer be able to sign in. Their past sales stay on record.`,()=>{db.users=db.users.filter(x=>x.id!==id);save();render();toast('Staff member removed')},'Remove');
}

/* ---------- render ---------- */
function render(){
  const v={dash:viewDash,sale:viewSale,orders:viewOrders,prod:viewProducts,serv:viewServices,cust:viewCustomers,vend:viewVendors,set:viewSettings}[view];
  $('#main').innerHTML=v();
  drawNav();applyLogo();
  if(view==='sale'){posGrid();posCart()}
  if(view==='set')checkPersist();
}
drawBanner();imgLoad().then(showAuth);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!window._swReloaded){window._swReloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
}
</script>
